name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies and PyInstaller
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Create wrapper entry point
        run: |
          @'
          from fxproxy.cli import main

          if __name__ == "__main__":
              main()
          '@ | Set-Content -Encoding utf8 run.py

      - name: Build EXE
        run: |
          pyinstaller --onefile --name fxproxy --paths . --collect-all fxproxy run.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: fxproxy-windows-exe
          path: dist/fxproxy.exe
