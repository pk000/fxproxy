name: Build Windows EXE (Nuitka)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies and Nuitka
        run: |
          pip install --no-cache-dir -e .
          pip install --no-cache-dir nuitka zstandard ordered-set

      - name: Create wrapper entry point
        run: |
          @'
          from fxproxy.cli import main

          if __name__ == "__main__":
              main()
          '@ | Set-Content -Encoding utf8 run.py

      - name: Build EXE with Nuitka
        run: |
          python -m nuitka --standalone --onefile `
            --assume-yes-for-downloads `
            --include-package=fxproxy `
            --include-package-data=fxproxy `
            --enable-plugin=anti-bloat `
            --remove-output `
            --output-filename=fxproxy.exe `
            run.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: fxproxy-windows-exe
          path: fxproxy.exe
