name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies and PyInstaller
        run: |
          pip install --no-cache-dir -e .
          pip install --no-cache-dir pyinstaller

      - name: Install UPX
        run: choco install upx -y

      - name: Create wrapper entry point
        run: |
          @'
          from fxproxy.cli import main

          if __name__ == "__main__":
              main()
          '@ | Set-Content -Encoding utf8 run.py

      - name: Build EXE
        env:
          PYTHONOPTIMIZE: "2"
        run: |
          pyinstaller --onefile `
            --name fxproxy `
            --paths . `
            --collect-all fxproxy `
            --upx-exclude=python312.dll `
            --upx-exclude=vcruntime140.dll `
            --exclude-module tkinter `
            --exclude-module unittest `
            --exclude-module pydoc `
            --exclude-module test `
            --exclude-module pdb `
            --exclude-module sqlite3 `
            --exclude-module _sqlite3 `
            --exclude-module xml `
            --exclude-module pyexpat `
            --exclude-module ftplib `
            --exclude-module imaplib `
            --exclude-module smtplib `
            --exclude-module poplib `
            --exclude-module telnetlib `
            --exclude-module turtle `
            --exclude-module lib2to3 `
            run.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: fxproxy-windows-exe
          path: dist/fxproxy.exe
